<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>新人起步手冊</title>
<style>
:root{--cream:#F5EDE0;--paper:#FFFBF5;--ink:#3D2B1A;--soft:#6B4E35;--line:#E6D8C3;--terra:#A85D42;--warn:#F8E3DA}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:32px 28px;width:min(100%,380px);display:grid;gap:14px;box-shadow:0 10px 30px rgba(61,43,26,.08)}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--terra);font-weight:700}
h1{margin:0;font-size:24px}
p{margin:0;font-size:14px;color:var(--soft);line-height:1.6}
label{font-size:14px;font-weight:700}
input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
button{font:inherit;font-size:16px;font-weight:700;padding:12px;border:none;border-radius:999px;background:var(--terra);color:#FFFBF5;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{background:var(--warn);color:var(--terra);border-radius:10px;padding:10px 12px;font-size:14px}
.note{font-size:12px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="eyebrow">LILY 團隊 · 只供內部使用</div>
  <h1>新人起步手冊</h1>
  <p>請輸入團隊提供的密碼。</p>
  <label for="pw">密碼</label>
  <input id="pw" type="password" required autofocus>
  <div class="err" id="err" hidden>密碼不正確，請再試一次。</div>
  <button id="go" type="submit">打開手冊</button>
  <p class="note">內容經加密，請勿轉發密碼。</p>
</form>

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function unlock(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct));
  return new TextDecoder().decode(pt);
}

  try{var html=await unlock(document.getElementById("pw").value);document.open();document.write(html);document.close();}
